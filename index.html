<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<title>OpenGravity Diagramas</title>
<meta name="description" content="Editor de diagramas para Android y Windows">
<meta name="theme-color" content="#0a2350">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!--CUERPO-->
<header class="barra" role="toolbar" aria-label="Herramientas">
  <button id="b-menu" class="btn" title="Menú"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Menú</span></button>
  <span class="sep"></span>
  <button id="b-caja" class="btn" title="Agregar caja"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="3"/></svg><span>Caja</span></button>
  <button id="b-texto" class="btn" title="Agregar texto"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg><span>Texto</span></button>
  <button id="b-grupo" class="btn" title="Agregar grupo (marco punteado)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1" stroke-dasharray="3 2.5"/></svg><span>Grupo</span></button>
  <span class="sep"></span>
  <button id="b-deshacer" class="btn" title="Deshacer (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Deshacer</span></button>
  <button id="b-rehacer" class="btn" title="Rehacer (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span>Rehacer</span></button>
  <span class="sep"></span>
  <button id="b-ajustar" class="btn" title="Ver todo el diagrama"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Ver todo</span></button>
  <button id="b-png" class="btn" title="Exportar imagen PNG"><svg viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg><span>PNG</span></button>
  <span class="nombre" id="nombre-doc"></span>
</header>

<main class="area">
  <svg id="lienzo" class="lienzo" xmlns="http://www.w3.org/2000/svg" aria-label="Lienzo del diagrama"></svg>
  <div class="pista" id="pista"><span class="pista-larga">Toca un elemento para editarlo · arrastra el <b>+</b> para conectarlo con otro · dos dedos o la rueda para hacer zoom</span><span class="pista-corta">Toca para editar · arrastra el <b>+</b> para conectar</span></div>
  <aside class="panel" id="panel" hidden></aside>
</main>

<div class="menu" id="menu" hidden>
  <button data-accion="nuevo">Nuevo diagrama en blanco</button>
  <button data-accion="plantilla">Plantilla: Arnés del agente</button>
  <hr>
  <button data-accion="abrir">Abrir archivo…</button>
  <button data-accion="guardar">Guardar archivo (.json)</button>
  <hr>
  <button data-accion="png">Exportar imagen PNG</button>
  <button data-accion="svg">Exportar imagen SVG</button>
  <button data-accion="compartir" id="m-compartir" hidden>Compartir imagen…</button>
  <hr>
  <button data-accion="fondo">Nombre y fondo del diagrama</button>
</div>

<div class="modal" id="modal" hidden>
  <div class="caja-modal">
    <p id="modal-texto"></p>
    <div class="acciones">
      <button id="modal-no" class="btn-sec">Cancelar</button>
      <button id="modal-si" class="btn-pri">Continuar</button>
    </div>
  </div>
</div>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>
<input type="file" id="archivo" accept=".json,application/json" hidden>
<!--/CUERPO-->
<script src="js/plantillas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
